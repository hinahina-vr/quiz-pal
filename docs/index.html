<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Pal</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20260907-quiz-pal">
    <style>
      body{margin:0}body[data-html-loading] > :not(.html-boot-loading){visibility:hidden}
      .html-boot-loading{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;max-width:none!important;margin:0!important;border:0!important;border-radius:0!important;background:#fffaf0}

      .html-boot-loading,.html-boot-error{box-sizing:border-box;max-width:720px;margin:12vh auto;padding:28px;font:16px/1.8 system-ui,sans-serif;color:#443749;background:#fffaf0;border:2px solid #443749;border-radius:18px}.html-boot-error h1{font-size:24px}.html-boot-error a{color:#16796f}
    </style>
    <script src="./html-pages.js"></script>
  </head>
  <body>
    <div class="html-boot-loading">Quiz Pal を準備しています…<noscript><p>このアプリはJavaScriptを使用します。ブラウザでJavaScriptを有効にしてください。</p></noscript></div>
    <script src="./html-boot.js"></script>
  </body>
</html>
